[project]
name = "musimo"
version = "0.4.0"
description = "A self-hosted music library companion"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "yt-dlp[default,curl-cffi]==2026.8.19",
  "bgutil-ytdlp-pot-provider==1.3.2",
  "mutagen==1.48.1",
  "watchdog==6.0.0",
]

[dependency-groups]
dev = [
    "coverage==7.16.0",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "ruff==0.16.6",
]

[tool.mypy]
python_version = "3.12"
strict = true
untyped_calls_exclude = ["mutagen"]
files = ["backend", "tests", "scripts"]

[tool.coverage.run]
branch = true
source = ["backend"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 70

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
