[project]
name = "musimo"
version = "0.4.0"
description = "A self-hosted music library companion"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "yt-dlp[default,curl-cffi]==2026.8.19",
  "bgutil-ytdlp-pot-provider==2.0.2",
  "mutagen==1.48.1",
  "watchdog==6.0.0",
  "tzdata==2026.5",
  "numpy==2.5.4",
]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "ruff==0.17.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
untyped_calls_exclude = ["mutagen"]
files = ["backend", "tests", "scripts", "worker"]

# The worker image's own dependency. It ships no types, and the web environment does not have it.
[[tool.mypy.overrides]]
module = ["librosa", "librosa.*"]
ignore_missing_imports = true

# The tempo-beat-v1 images' own dependencies (worker/beat), likewise untyped and not installed here.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "beat_this", "beat_this.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["backend"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 70

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
