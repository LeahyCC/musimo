# The tempo-beat-v1 worker images' dependencies, locked once for the CPU and once for CUDA.
# The code is ../audio_worker; this project only pins what the images install. The versions are
# the ones the analyser bake-off measured (docs/analyzer-bakeoff.md). CUDA 12.8 is the first
# build with RTX 50-series (sm_120) support.
[project]
name = "musimo-beat-worker"
version = "0.5.0"
description = "Beat This! tempo for Musimo's song analysis, on the CPU or a graphics card"
requires-python = "==3.12.*"
dependencies = [
  "numpy==2.2.6",
  "beat-this==1.1.0",
  "soxr==0.5.0.post1",
  "einops==0.8.1",
  "rotary-embedding-torch==0.8.6",
]

[project.optional-dependencies]
cpu = ["torch==2.7.1", "torchaudio==2.7.1"]
gpu = ["torch==2.7.1", "torchaudio==2.7.1"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
# The images are Linux on x86-64. Nothing else installs this.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "gpu" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
extend = "../../pyproject.toml"
