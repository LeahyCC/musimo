services:
  musimo:
    build: .
    image: musimo:0.4.0
    init: true
    ports:
      - '${MUSIMO_BIND:-127.0.0.1}:${MUSIMO_PORT:-8765}:8765'
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      MUSIMO_LIBRARY_ROOTS: /music
      MUSIMO_WATCH_MODE: '${MUSIMO_WATCH_MODE:-native}'
      MUSIMO_POLL_INTERVAL_SECONDS: '${MUSIMO_POLL_INTERVAL_SECONDS:-300}'
      # Deezer cookie from .env, for the first start only. Musimo moves it into
      # /data/deezer-arl.txt, and Settings replaces or removes it after that.
      MUSIMO_DEEZER_ARL: '${MUSIMO_DEEZER_ARL:-}'
      # Search catalog for the first start only. deezer or spotify. Blank leaves the default.
      MUSIMO_SEARCH_CATALOG: '${MUSIMO_SEARCH_CATALOG:-}'
      # Spotify app for the first start only. Musimo moves the pair into
      # /data/spotify-app.json, and Settings replaces or removes it after that.
      MUSIMO_SPOTIFY_CLIENT_ID: '${MUSIMO_SPOTIFY_CLIENT_ID:-}'
      MUSIMO_SPOTIFY_CLIENT_SECRET: '${MUSIMO_SPOTIFY_CLIENT_SECRET:-}'
      # Shared with the audio worker below. Empty keeps the worker's lease routes off.
      MUSIMO_ANALYSIS_TOKEN: '${MUSIMO_ANALYSIS_TOKEN:-}'
    volumes:
      - musimo-data:/data
      - ./runtime/music:/music
    restart: unless-stopped
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    profiles: [youtube]
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  # Song analysis: measures tempo-beat-v1 (tempo and energy) for the music bot, only for songs
  # queued from the Song analysis page or scripts/enqueue_audio_trial.py. Off unless started with
  # --profile analysis (this CPU worker) or --profile analysis-gpu (the one below); run one. It
  # reads music read-only, never opens the database and has no swap. The caps come from .env:
  # the defaults here are the safe ones, one core, 2 GB and one decoder.
  audio-worker:
    build:
      context: ./worker
      dockerfile: beat.Dockerfile
      args:
        VARIANT: cpu
    image: musimo-audio-worker-beat:0.5.0-cpu
    profiles: [analysis]
    init: true
    user: '${PUID:-1000}:${PGID:-1000}'
    mem_limit: '${MUSIMO_WORKER_MEMORY:-2g}'
    memswap_limit: '${MUSIMO_WORKER_MEMORY:-2g}'
    cpus: '${MUSIMO_WORKER_CPUS:-1}'
    environment:
      MUSIMO_ANALYSIS_TOKEN: '${MUSIMO_ANALYSIS_TOKEN:-}'
      MUSIMO_APP_URL: http://musimo:8765
      MUSIMO_LIBRARY_ROOTS: /music
      MUSIMO_WORKER_DEVICE: cpu
      MUSIMO_WORKER_DECODERS: '${MUSIMO_WORKER_DECODERS:-1}'
    volumes:
      - ./runtime/music:/music:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m
    depends_on:
      musimo:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
  # The same worker on an NVIDIA graphics card (CUDA 12.8, RTX 50-series included). Needs Docker
  # with GPU support. Opt-in caps, also from .env: 4 cores, 4 GB and 4 decoders by default.
  audio-worker-gpu:
    build:
      context: ./worker
      dockerfile: beat.Dockerfile
      args:
        VARIANT: gpu
    image: musimo-audio-worker-beat:0.5.0-gpu
    profiles: [analysis-gpu]
    init: true
    user: '${PUID:-1000}:${PGID:-1000}'
    mem_limit: '${MUSIMO_WORKER_MEMORY:-4g}'
    memswap_limit: '${MUSIMO_WORKER_MEMORY:-4g}'
    cpus: '${MUSIMO_WORKER_CPUS:-4}'
    environment:
      MUSIMO_ANALYSIS_TOKEN: '${MUSIMO_ANALYSIS_TOKEN:-}'
      MUSIMO_APP_URL: http://musimo:8765
      MUSIMO_LIBRARY_ROOTS: /music
      MUSIMO_WORKER_DEVICE: auto
      MUSIMO_WORKER_DECODERS: '${MUSIMO_WORKER_DECODERS:-4}'
    volumes:
      - ./runtime/music:/music:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      musimo:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
volumes:
  musimo-data:
