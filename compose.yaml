services:
  musimo:
    build: .
    image: musimo:0.4.0
    init: true
    ports:
      - '${MUSIMO_BIND:-127.0.0.1}:${MUSIMO_PORT:-8765}:8765'
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      MUSIMO_LIBRARY_ROOTS: /music
      MUSIMO_WATCH_MODE: '${MUSIMO_WATCH_MODE:-native}'
      MUSIMO_POLL_INTERVAL_SECONDS: '${MUSIMO_POLL_INTERVAL_SECONDS:-60}'
    volumes:
      - musimo-data:/data
      - ./runtime/music:/music
    restart: unless-stopped
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    profiles: [youtube]
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  musimo-data:
